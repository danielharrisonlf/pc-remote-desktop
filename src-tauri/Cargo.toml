[package]
name = "pc-remote-desktop"
version = "0.6.9"
edition = "2021"

[lib]
name = "pc_remote_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.3"
tauri-plugin-notification = "=2.5.1"
tauri-plugin-updater = { version = "=2.13.3", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.28"
tokio-rustls = "0.26"
rustls = "0.23.46"
rustls-pemfile = "2.2"
rcgen = "0.14"
sha2 = "0.10"
rand = "0.9"
uuid = { version = "1.18", features = ["v4", "serde"] }
futures-util = "0.3"
mdns-sd = "0.21"
local-ip-address = "0.6"
hex = "0.4"
base64 = "0.22"
semver = "1.0.28"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
log = "0.4"
tracing = "0.1"

[dev-dependencies]
# MockRuntime app for the updater tests; dev-only features do not reach release builds.
tauri = { version = "2.12.3", features = ["tray-icon", "test"] }
tokio = { version = "1.48", features = ["io-util"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Ole", "Win32_System_WinRT", "Win32_System_SystemInformation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_Power", "Win32_System_Threading", "Win32_System_Shutdown", "Win32_Security", "Media_Control"] }
windows-registry = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = "3.4"
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
x11rb = { version = "0.13", features = ["xtest", "randr"] }
libc = "0.2"
