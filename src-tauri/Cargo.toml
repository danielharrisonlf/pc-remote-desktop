[package]
name = "pc-remote-desktop"
version = "0.4.0"
edition = "2021"

[lib]
name = "pc_remote_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.3"
tauri-plugin-notification = "=2.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.28"
tokio-rustls = "0.26"
rustls = "0.23.46"
rustls-pemfile = "2.2"
rcgen = "0.14"
sha2 = "0.10"
rand = "0.9"
uuid = { version = "1.18", features = ["v4", "serde"] }
futures-util = "0.3"
mdns-sd = "0.21"
local-ip-address = "0.6"
hex = "0.4"
base64 = "0.22"
windows = { version = "0.62.2", features = ["Foundation", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Ole", "Win32_System_WinRT", "Win32_System_SystemInformation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Storage_FileSystem", "Media_Control"] }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.5"
